<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="brand-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Rounded blue gradient background -->
  <rect width="128" height="128" rx="28" fill="url(#brand-bg)"/>

  <!-- Bold "N" monogram (Newton) -->
  <path d="M34 84 V36 L86 84 V36"
        stroke="#ffffff" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"
        fill="none"/>

  <!-- Green attendance checkmark badge -->
  <circle cx="98" cy="98" r="18" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
  <path d="M90 98 L96 104 L107 91"
        stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"
        fill="none"/>
</svg>